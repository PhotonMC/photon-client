[package]
name = "photon-oracle"
description = "The Rust side of the behavior runner: a JSONL adapter the Java oracle's records are compared against."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
include = ["/Cargo.toml", "/src/**"]

[dependencies]
photon-assets.workspace = true
photon-core.workspace = true
photon-data.workspace = true
photon-world.workspace = true
photon-audio = { workspace = true, features = ["device"] }
photon-game.workspace = true
photon-net.workspace = true
photon-protocol.workspace = true
photon-render.workspace = true
photon-gui.workspace = true
glfw.workspace = true
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[lints]
workspace = true
