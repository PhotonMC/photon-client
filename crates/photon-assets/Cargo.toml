[package]
name = "photon-assets"
description = "Resource packs and the stack the game's assets are read through."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
include = ["/Cargo.toml", "/src/**"]

[dependencies]
photon-core.workspace = true
log.workspace = true
flate2.workspace = true
regex = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }


# `flate2` is named only to choose the backend `zip` inflates with.
[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true
