[package]
name = "photon-video"
description = "Game page video: a WebM file with AV1 video, fetched, demuxed and decoded natively."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
include = ["/Cargo.toml", "/src/**"]

[dependencies]
log.workspace = true
ureq.workspace = true
# Pure Rust AV1 decoder (BSD-2-Clause); without the assembly feature it needs no assembler.
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8"] }
webm-iterable = "0.7.1"

[lints]
workspace = true
