[package]
name = "photon-audio"
description = "Sound decoding, mixing and output."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
include = ["/Cargo.toml", "/src/**"]

[dependencies]
log.workspace = true
cpal = { version = "0.18.2", optional = true }
lewton = "0.10.2"

[features]
default = ["device"]
# The sound card output (`cpal`); the engine crates leave it off.
device = ["dep:cpal"]

[lints]
workspace = true
