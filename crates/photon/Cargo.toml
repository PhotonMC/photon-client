[package]
name = "photon"
description = "The client application: window, session loop, screens and scripted runs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
include = ["/Cargo.toml", "/build.rs", "/src/**", "/examples/**"]

[dependencies]
log.workspace = true
photon-assets.workspace = true
photon-core.workspace = true
photon-data.workspace = true
photon-world.workspace = true
photon-audio = { workspace = true, features = ["device"] }
photon-game.workspace = true
photon-net.workspace = true
photon-content.workspace = true
photon-render.workspace = true
photon-gui.workspace = true
bevy_ecs.workspace = true
flate2.workspace = true
glfw.workspace = true

[dev-dependencies]
photon-protocol.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true
