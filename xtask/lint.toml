# Architecture rules enforced by `cargo xtask lint`.

# Programs whose terminal output is their interface.
binary_crates = ["photon", "photon-oracle", "xtask"]

# The Vulkan backend is the one place raw FFI is expected.
unsafe_allowed = ["crates/photon-render/src/vulkan"]

# Translations and text-handling test data.
non_ascii_allowed = []

# Where `Version` values may be compared: version modules and the dispatch points (ADR 0013).
version_allowed = ["crates/photon-core/src/version.rs", "crates/photon-data/src/version_registries.rs", "crates/photon-data/src/block/definition.rs", "crates/photon-data/src/item/definition.rs"]

# Where `Version::NEWEST` or the `PHOTON_CONNECT_VERSION` override may be named: the places that select a version, and tests. Everything
# else takes the session's registries, so a connection to an older version is not numbered by
# the newest one.
newest_allowed = [
    "crates/photon-core/src/version.rs",
    "crates/photon-data/src/version_registries.rs",
    "crates/photon-net/src/connection.rs",
    "crates/photon-net/src/connection/session.rs",
    "crates/photon-net/src/connection/version.rs",
    "crates/photon-net/src/connection/play/version_tests.rs",
    "crates/photon-dev/src/",
    "crates/photon/src/menu.rs",
    "crates/photon-world/src/world/dimension.rs",
    "crates/photon-world/src/tests.rs",
    "crates/photon-game/src/menus/creative.rs",
    "crates/photon-gui/src/screen/creative.rs",
    "crates/photon-protocol/src/play/tests.rs",
    "crates/photon-protocol/src/play/wire_ids.rs",
    "crates/photon-oracle/src/case_ids.rs",
]

# Each package may depend only on the workspace packages listed for it.
# Dependencies flow one way: core -> data -> world -> game -> net / render -> app.
# render -> game and audio -> game are known debts (GUI and sound-engine types
# live in the wrong crate); they stay in the baseline until moved.
[layers]
photon-core = []
photon-assets = ["photon-core"]
photon-data = ["photon-core"]
photon-world = ["photon-core", "photon-data"]
photon-game = ["photon-core", "photon-data", "photon-world", "photon-audio"]
photon-protocol = ["photon-core", "photon-data"]
photon-net = [
    "photon-core",
    "photon-data",
    "photon-world",
    "photon-game",
    "photon-protocol",
]
photon-content = ["photon-core", "photon-net"]
photon-api = []
photon-update = []
photon-render = ["photon-core", "photon-data", "photon-world", "photon-assets"]
photon-gui = [
    "photon-core",
    "photon-data",
    "photon-world",
    "photon-game",
    "photon-render",
    "photon-assets",
]
photon-audio = []
photon = [
    "photon-assets",
    "photon-core",
    "photon-data",
    "photon-world",
    "photon-game",
    "photon-protocol",
    "photon-net",
    "photon-content",
    "photon-update",
    "photon-api",
    "photon-render",
    "photon-gui",
    "photon-audio",
]
photon-oracle = [
    "photon-core",
    "photon-assets",
    "photon-data",
    "photon-world",
    "photon-game",
    "photon-protocol",
    "photon-net",
    "photon-render",
    "photon-gui",
    "photon-audio",
]
photon-dev = [
    "photon-core",
    "photon-data",
    "photon-world",
    "photon-game",
    "photon-protocol",
    "photon-net",
]
parity-cases = []
xtask = ["parity-cases"]
