[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Repository automation: lint rules, git hooks, the commit gate."

[dependencies]
flate2.workspace = true
parity-cases.workspace = true
photon-core.workspace = true
photon-update.workspace = true
ring = { version = "0.17", default-features = false }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
rayon.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "2.0.119", features = ["full", "visit"] }
toml = "0.9"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
