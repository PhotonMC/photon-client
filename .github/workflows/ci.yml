name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Repository rules (file size, complexity, naming, layering, ASCII) and
  # formatting: no native dependencies, so it fails fast.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: xtask
      - run: cargo fmt --all --check
      - run: cargo xtask lint
      - name: Lint baseline is tight
        # `cargo xtask lint` lowers the baseline when code improves; a changed
        # file here means the improvement was not committed.
        run: git diff --exit-code xtask/lint-baseline.toml

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        if: runner.os == 'Linux'
        # shaderc and glfw build their native code from source; cpal needs ALSA.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 libasound2-dev libwayland-dev \
            libxkbcommon-dev xorg-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No Minecraft assets or Java reference exist in CI; the unit tests need
      # none and the parity runs stay local until the runner can fetch the
      # reference itself.
      - run: cargo test --workspace --lib --bins --tests

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@v0.9.1
