[workspace]
members = ["crates/*", "parity/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
photon-core = { path = "crates/photon-core" }
photon-assets = { path = "crates/photon-assets" }
photon-data = { path = "crates/photon-data" }
photon-world = { path = "crates/photon-world" }
photon-game = { path = "crates/photon-game" }
photon-protocol = { path = "crates/photon-protocol" }
photon-net = { path = "crates/photon-net" }
photon-dev = { path = "crates/photon-dev" }
photon-render = { path = "crates/photon-render" }
photon-gui = { path = "crates/photon-gui" }
photon-audio = { path = "crates/photon-audio", default-features = false }
parity-cases = { path = "parity/cases" }
ash = "0.38.0"
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
ash-window = "0.13.0"
aes = "0.8"
cfb8 = "0.8"
getrandom = "0.2"
rsa = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
keyring-core = "1"
dbus-secret-service-keyring-store = { version = "1", default-features = false, features = ["crypto-rust"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
log = { version = "0.4.34", features = ["std"] }
glfw = { version = "0.62.0", default-features = false, features = ["raw-window-handle-v0-6", "vulkan", "wayland", "x11", "src-build"] }
raw-window-handle = "0.6.2"
rayon = "1.12.0"
shaderc = "0.10.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# File size, function size and complexity limits are `cargo xtask lint` rules
# (xtask/src/lint.rs); clippy keeps the remaining limits in clippy.toml.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# A pedantic subset: the lints whose fixes cannot change what Java-parity code computes and that
# fit the codebase's idioms. The rest (casts, float comparison, wildcard imports, `must_use` and
# doc lints, line limits) stay off; see docs/development/coding-standards.md.
bool_to_int_with_if = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
manual_assert = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
unnested_or_patterns = "warn"
uninlined_format_args = "warn"

# Java integer arithmetic always wraps. Keeping overflow checks on in both
# profiles makes an unintended wrap a test failure instead of a silent
# release-only divergence; deliberate wrapping is written with `wrapping_*`.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

# The lint parses the whole workspace on every commit; an optimized parser
# keeps the pre-commit hook fast without a release build of everything else.
[profile.dev.package.xtask]
opt-level = 2

[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3
