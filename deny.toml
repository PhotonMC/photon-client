# cargo-deny policy: licenses, security advisories, duplicate versions.
# Run with `cargo deny check`; CI does the same.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin leaks a private key through the timing of RSA decryption. The client only encrypts
    # with the server's public key (login key exchange) and never holds a private key.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# The workspace crates carry no license field yet (open decision in the
# quality review); third-party crates are still checked.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
